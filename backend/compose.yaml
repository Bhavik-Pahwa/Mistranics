services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mistranics
      POSTGRES_USER: mistranics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mistranics"]
      interval: 3s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mistranics:${POSTGRES_PASSWORD}@db:5432/mistranics
    ports: ["127.0.0.1:8000:8000"]
    command:
      - sh
      - -c
      - python -m backend.app.manage migrate && exec python -m uvicorn backend.app.main:create_app --factory --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
